<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bill Splitter</title>

  <!-- STYLE: how the page looks (colors, sizes, spacing) -->
  <style>
    /* Colors used everywhere, in one place so they're easy to change */
    :root {
      --table: #3a2e28;   /* dark wood "restaurant table" behind the receipt */
      --paper: #fbf8f1;   /* off-white receipt paper */
      --ink: #2a2a2a;     /* printer ink */
      --faded: #8a857c;   /* lighter ink for small print */
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--table);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px 64px;
      box-sizing: border-box;
      font-family: Consolas, "Courier New", monospace;
      color: var(--ink);
    }

    /* The wrapper casts the shadow (so it follows the torn edge) and tilts slightly */
    .receipt-wrap {
      width: 100%;
      max-width: 360px;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
      transform: rotate(-0.8deg);
    }

    .receipt {
      position: relative;
      background: var(--paper);
      padding: 28px 24px 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Zig-zag torn bottom edge: a row of paper "teeth", each 16px wide */
    .receipt::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 8px;
      background: conic-gradient(from 135deg at top, transparent 90deg, var(--paper) 0) 0 0 / 16px 100%;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.15em;
    }
    .subtitle, .date, .thanks { text-align: center; }
    .subtitle { margin: 6px 0 2px; text-transform: none; }
    .date { font-size: 0.8rem; color: var(--faded); }

    .divider { border-top: 2px dashed var(--ink); margin: 16px 0; }
    .divider.double { border-top: 4px double var(--ink); }

    /* A row like:  TOTAL .......... 540.00 */
    .row {
      display: flex;
      align-items: baseline;
      margin: 10px 0;
    }
    .leader {
      flex: 1;
      border-bottom: 2px dotted var(--faded);
      margin: 0 8px;
      min-width: 16px;
    }
    label { font-weight: 700; }

    /* Inputs: no boxes, just an underline, numbers right-aligned like prices */
    input {
      font: inherit;
      color: inherit;
      width: 110px;
      text-align: right;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--ink);
      padding: 2px 0;
      appearance: textfield;
      -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus { outline: none; background: rgba(0, 0, 0, 0.05); }
    input::placeholder { color: var(--faded); }

    /* Tip buttons: small outlined "stamps"; the chosen one is filled with ink */
    .tip-buttons { display: flex; gap: 6px; margin-top: 8px; }
    .tip-buttons button {
      flex: 1;
      font: inherit;
      font-size: 0.85rem;
      text-transform: inherit;
      letter-spacing: inherit;
      padding: 8px 0;
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 2px;
      cursor: pointer;
    }
    .tip-buttons button:hover { background: rgba(0, 0, 0, 0.06); }
    .tip-buttons button.selected { background: var(--ink); color: var(--paper); }

    .custom-row { justify-content: flex-end; }
    .custom-row[hidden] { display: none; }

    .per-person { font-size: 1.6rem; font-weight: 700; margin: 14px 0 6px; }
    .per-person .leader { border-bottom-width: 3px; border-color: var(--ink); }

    .thanks { margin-top: 18px; letter-spacing: 0.3em; font-weight: 700; }
    .small-print { text-align: center; font-size: 0.7rem; color: var(--faded); margin-top: 4px; }

    /* On narrow phone screens: no tilt, a bit less padding */
    @media (max-width: 420px) {
      body { padding-top: 24px; }
      .receipt-wrap { transform: none; }
      .receipt { padding: 24px 16px 18px; }
    }
  </style>
</head>
<body>

  <!-- CONTENT: what is on the page -->
  <div class="receipt-wrap">
    <div class="receipt">
      <h1>Bill Splitter</h1>
      <div class="subtitle" id="tableFor">~ table for 2 ~</div>
      <div class="date" id="date"></div>

      <div class="divider"></div>

      <div class="row">
        <label for="bill">Bill</label><span class="leader"></span>
        <input id="bill" type="number" min="0" step="0.01" placeholder="0.00">
      </div>

      <div class="row"><label>Tip</label></div>
      <div class="tip-buttons">
        <button data-tip="0">0%</button>
        <button data-tip="10" class="selected">10%</button>
        <button data-tip="15">15%</button>
        <button data-tip="20">20%</button>
        <button data-tip="custom">Custom</button>
      </div>
      <div class="row custom-row" id="customRow" hidden>
        <label for="customTip">Tip %</label><span class="leader"></span>
        <input id="customTip" type="number" min="0" step="0.5" placeholder="12">
      </div>

      <div class="row">
        <label for="people">Guests</label><span class="leader"></span>
        <input id="people" type="number" min="1" step="1" value="2">
      </div>

      <div class="divider"></div>

      <div class="row"><span>Tip</span><span class="leader"></span><span id="tipAmount">0.00</span></div>
      <div class="row"><span>Total</span><span class="leader"></span><span id="total">0.00</span></div>
      <div class="row"><span>Rounding</span><span class="leader"></span><span id="roundingExtra">0.00</span></div>

      <div class="divider double"></div>

      <div class="row per-person"><span>Each pays</span><span class="leader"></span><span id="perPerson">0</span></div>

      <div class="thanks">Thank you!</div>
      <div class="small-print">Shares rounded up to whole numbers</div>
    </div>
  </div>

  <!-- SCRIPT: what the page does (the calculation) -->
  <script>
    let tipPercent = 10;
    const customTip = document.getElementById("customTip");
    const customRow = document.getElementById("customRow");

    // Print today's date and time at the top, like a real receipt
    document.getElementById("date").textContent =
      new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

    // When a tip button is clicked: remember its value and highlight it
    document.querySelectorAll(".tip-buttons button").forEach(function (button) {
      button.addEventListener("click", function () {
        document.querySelectorAll(".tip-buttons button").forEach(b => b.classList.remove("selected"));
        button.classList.add("selected");

        if (button.dataset.tip === "custom") {
          // Show the custom box and use whatever is typed in it
          customRow.hidden = false;
          customTip.focus();
          tipPercent = Number(customTip.value) || 0;
        } else {
          customRow.hidden = true;
          tipPercent = Number(button.dataset.tip);
        }
        calculate();
      });
    });

    // Typing in the custom box updates the tip right away
    customTip.addEventListener("input", function () {
      tipPercent = Number(customTip.value) || 0;
      calculate();
    });

    // Recalculate every time the user types
    document.getElementById("bill").addEventListener("input", calculate);
    document.getElementById("people").addEventListener("input", calculate);

    function calculate() {
      const bill = Number(document.getElementById("bill").value) || 0;
      const people = Math.max(1, Number(document.getElementById("people").value) || 1);

      const tip = bill * tipPercent / 100;
      const total = bill + tip;
      // Round each share UP to a whole number. Rounding to cents first stops
      // tiny computer math errors (like 168.0000001) from adding an extra 1.
      const exactShare = Math.round(total / people * 100) / 100;
      const perPerson = Math.ceil(exactShare);
      const roundingExtra = perPerson * people - total;

      document.getElementById("tipAmount").textContent = tip.toFixed(2);
      document.getElementById("total").textContent = total.toFixed(2);
      document.getElementById("roundingExtra").textContent = roundingExtra.toFixed(2);
      document.getElementById("perPerson").textContent = perPerson;
      document.getElementById("tableFor").textContent = "~ table for " + people + " ~";
    }
  </script>

</body>
</html>
